services:
  postgres:
    image: postgres:16-alpine
    container_name: evok-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_evok_audio
      POSTGRES_USER: evok_admin
      # Default apenas para desenvolvimento local. Em qualquer ambiente
      # compartilhado, defina DB_PASSWORD no .env (nao versionado).
      POSTGRES_PASSWORD: ${DB_PASSWORD:-evok_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evok_admin -d erp_evok_audio"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: erp-evok-audio-server:${APP_IMAGE_TAG:-local}
    container_name: evok-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: erp_evok_audio
      DB_USER: evok_admin
      DB_PASSWORD: ${DB_PASSWORD:-evok_local_dev}
      DB_SSL: ${DB_SSL:-false}
      DB_LOGGING: ${DB_LOGGING:-false}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-change-me-123456789}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-dev-only-change-me-please}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const req=http.get('http://127.0.0.1:5000/health/ready',res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:

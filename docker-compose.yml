services:
  postgres:
    image: postgres:16-alpine
    container_name: evok-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_evok_audio
      POSTGRES_USER: evok_admin
      TZ: America/Sao_Paulo
      # DB_PASSWORD e obrigatorio (sem fallback fraco): falha explicita no
      # startup se nao estiver definido no .env, em vez de subir com uma
      # senha default previsivel silenciosamente.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env antes de subir o Postgres}
    ports:
      # Vinculado apenas a localhost: a API acessa via rede interna do
      # compose (DB_HOST=postgres); acesso administrativo remoto deve usar
      # tunel SSH, nunca expor 0.0.0.0:5432 publicamente.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evok_admin -d erp_evok_audio"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: erp-evok-audio-server:${APP_IMAGE_TAG:-local}
    container_name: evok-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: erp_evok_audio
      DB_USER: evok_admin
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env antes de subir a API}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_CA_PATH: ${DB_SSL_CA_PATH:-}
      DB_LOGGING: ${DB_LOGGING:-false}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-change-me-123456789}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-dev-only-change-me-please}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const req=http.get('http://127.0.0.1:5000/health/ready',res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:

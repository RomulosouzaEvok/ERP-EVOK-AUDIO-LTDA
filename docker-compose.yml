services:
  postgres:
    image: postgres:16-alpine
    container_name: evok-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_evok_audio
      POSTGRES_USER: evok_admin
      # Default apenas para desenvolvimento local. Em qualquer ambiente
      # compartilhado, defina DB_PASSWORD no .env (nao versionado).
      POSTGRES_PASSWORD: ${DB_PASSWORD:-evok_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evok_admin -d erp_evok_audio"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: evok-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_evok_audio
      POSTGRES_USER: evok_admin
      TZ: America/Sao_Paulo
      # DB_PASSWORD e obrigatorio (sem fallback fraco): falha explicita no
      # startup se nao estiver definido no .env, em vez de subir com uma
      # senha default previsivel silenciosamente.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env antes de subir o Postgres}
    ports:
      # Vinculado apenas a localhost: a API acessa via rede interna do
      # compose (DB_HOST=postgres); acesso administrativo remoto deve usar
      # tunel SSH, nunca expor 0.0.0.0:5432 publicamente.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evok_admin -d erp_evok_audio"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: erp-evok-audio-server:${APP_IMAGE_TAG:-local}
    container_name: evok-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # `server/Dockerfile` ja declara `ENV NODE_ENV=production` no estagio de
      # runtime. Um default aqui (`${NODE_ENV:-development}`) REBAIXAVA esse
      # modo em silencio, sem ninguem declarar nada. Apagar a linha tambem nao
      # serve: o dev herdaria 'production' e o boot cairia em DB_SSL/CORS_ORIGIN.
      # A escolha do ambiente passa a ser explicita e auditavel — declare
      # NODE_ENV no .env (ver .env.docker.example) antes de `docker compose up`.
      NODE_ENV: ${NODE_ENV:?defina NODE_ENV no .env (development | test | production) antes de subir a API}
      PORT: 5000
      TZ: America/Sao_Paulo
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: erp_evok_audio
      DB_USER: evok_admin
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env antes de subir a API}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_CA_PATH: ${DB_SSL_CA_PATH:-}
      DB_LOGGING: ${DB_LOGGING:-false}
      # Chave de assinatura de token: obrigatoria, sem default versionado. Um
      # default aqui e' um segredo publicado — quem le o repositorio assina
      # token valido para qualquer usuario, e o servidor concede o papel real
      # daquele usuario (AUD-AUTHN-01). Mesma forma ja usada para DB_PASSWORD
      # acima. Gere o seu: `openssl rand -hex 32` (>= 32 caracteres, e nao pode
      # comecar com CHANGE_ME/dev-only-change-me — a API reprova no boot).
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env antes de subir a API (gere com `openssl rand -hex 32`)}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-dev-only-change-me-please}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
    ports:
      # Exposto em 0.0.0.0:5000 propositalmente em dev: os apps mobile/TV da
      # rede local acessam a API pelo IP da maquina (ex.: 172.16.0.164:5000).
      # Bind em 127.0.0.1 quebraria esse fluxo de dev.
      # EM PRODUCAO: troque para "127.0.0.1:5000:5000" e coloque um reverse
      # proxy TLS (nginx/Caddy) na frente, terminando HTTPS e repassando
      # para 127.0.0.1:5000 — nunca exponha a API em 0.0.0.0 diretamente
      # na internet.
      - "5000:5000"
    volumes:
      # Uploads (fotos/desenhos de produto) gravados pela API precisam
      # sobreviver a `docker compose up --build` / recreate do container.
      # Sem volume nomeado aqui, todo arquivo enviado via multer some no
      # próximo rebuild da imagem. Este diretório DEVE entrar na rotina de
      # backup junto com o dump do Postgres (ver docs/infra/DEPLOY_UBUNTU.md).
      - app_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const req=http.get('http://127.0.0.1:5000/health/ready',res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
  # Persistencia de uploads (fotos/desenhos de produto enviados via multer).
  # Sem isso, dados sao perdidos a cada `docker compose up --build` ou
  # recreate do container `api`. Inclua no backup junto com o dump do
  # Postgres (ver checklist em docs/infra/DEPLOY_UBUNTU.md).
  app_uploads:
